<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/AppOLO_logo.png" />
    <link rel="apple-touch-icon" href="/AppOLO_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AppoloDesk</title>
    <script>
      // Apply the saved theme before paint to avoid a light→dark flash.
      try {
        if (localStorage.getItem("appolo_theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
